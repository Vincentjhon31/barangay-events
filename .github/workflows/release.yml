name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Clean project
        run: flutter clean

      - name: Set up Android signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_FILE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets. Add KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in repository settings."
            exit 1
          fi

          mkdir -p android/app
          echo "$KEYSTORE_FILE" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK to e-calendar-<version>.apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%+*}"
          # The permanent QR/download link is the GitHub Pages redirect at
          # https://vincentjhon31.github.io/barangay-events/ (docs/index.html),
          # which always forwards to this versioned file.
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/e-calendar-${VERSION}.apk"
          ls -lh build/app/outputs/flutter-apk/e-calendar-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/e-calendar-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify app-update push channel
        # Non-fatal: a release should still succeed even if this secret
        # hasn't been configured yet (see README.md's "Push Notifications"
        # section for one-time setup). Reuses the same Supabase project the
        # app talks to (see the Supabase.initialize URL in lib/main.dart).
        continue-on-error: true
        env:
          RELEASE_NOTIFY_SECRET: ${{ secrets.RELEASE_NOTIFY_SECRET }}
        run: |
          if [ -z "$RELEASE_NOTIFY_SECRET" ]; then
            echo "RELEASE_NOTIFY_SECRET not set — skipping app-update push notification."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%+*}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"

          curl -sf -X POST \
            "https://xuxnoydakqembrytdbyz.supabase.co/functions/v1/send-app-update-notification" \
            -H "Authorization: Bearer $RELEASE_NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${VERSION}\",\"releaseUrl\":\"${RELEASE_URL}\"}"

  build-windows:
    # Runs after the Android job so the release it creates already exists —
    # this job only adds the Windows zip onto it, avoiding two jobs racing
    # to create the same GitHub Release at once.
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Install MSVC ATL component
        # flutter_local_notifications' Windows plugin needs ATL headers
        # (atlbase.h), which aren't part of the runner's default C++
        # workload — same fix as a local dev machine hitting "Cannot open
        # include file: 'atlbase.h'" when running `flutter build windows`.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $vsInstaller modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart | Out-Null

      - name: Build release Windows app
        run: flutter build windows --release

      - name: Zip Windows build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v') -replace '\+.*',''
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "e-calendar-$version-windows.zip"

      - name: Add Windows build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: e-calendar-*-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
