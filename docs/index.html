<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eBongabong Calendar has moved</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://calendar.bongabong.gov.ph/download/">
  <link rel="canonical" href="https://calendar.bongabong.gov.ph/download/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #F4F6FA; color: #142033; text-align: center; }
    a { color: #1559C9; font-weight: 700; }
    @media (prefers-color-scheme: dark) { body { background: #0B111C; color: #EEF2FA; } a { color: #8DBBFF; } }
  </style>
</head>
<body>
  <p>eBongabong Calendar has moved to the Municipality of Bongabong's own website.<br>
     <a href="https://calendar.bongabong.gov.ph/download/">Continue to the download page</a></p>
  <script>
    // Keeps whatever came after the old address (e.g. #users/new in the portal).
    location.replace('https://calendar.bongabong.gov.ph/download/' + location.hash);
  </script>
</body>
</html>
