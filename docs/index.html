<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>e-Calendar — Barangay Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #06080f;
        --bg-secondary: #0c1020;
        --bg-card: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.08);
        --text-primary: #f0f4ff;
        --text-secondary: #8892b0;
        --text-muted: #5a6480;
        --accent: #4f8cff;
        --accent-glow: rgba(79, 140, 255, 0.25);
        --accent-hover: #6aa0ff;
        --success: #34d399;
        --gradient-1: #4f8cff;
        --gradient-2: #a855f7;
        --gradient-3: #ec4899;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .bg-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(rgba(79, 140, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79, 140, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 70%);
      }

      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .bg-glow::before {
        content: "";
        position: absolute;
        top: -20%;
        left: 50%;
        transform: translateX(-50%);
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
        opacity: 0.4;
      }

      .bg-glow::after {
        content: "";
        position: absolute;
        bottom: -30%;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 60%);
      }

      .container {
        position: relative;
        z-index: 1;
        max-width: 680px;
        margin: 0 auto;
        padding: 48px 24px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .hero {
        text-align: center;
        margin-bottom: 40px;
      }

      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        box-shadow:
          0 0 40px var(--accent-glow),
          0 8px 32px rgba(0, 0, 0, 0.4);
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      .hero h1 {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        background: linear-gradient(135deg, var(--text-primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .hero .tagline {
        font-size: 15px;
        color: var(--text-secondary);
        line-height: 1.6;
        max-width: 420px;
        margin: 0 auto;
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px;
        width: 100%;
        max-width: 440px;
        backdrop-filter: blur(12px);
        margin-bottom: 24px;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .status-text {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .version-badge {
        margin-left: auto;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        background: rgba(79, 140, 255, 0.1);
        padding: 4px 10px;
        border-radius: 100px;
        border: 1px solid rgba(79, 140, 255, 0.2);
      }

      .btn-download {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 16px 28px;
        background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow:
          0 4px 20px var(--accent-glow),
          0 0 0 0 rgba(79, 140, 255, 0);
        text-decoration: none;
        position: relative;
        overflow: hidden;
      }

      .btn-download::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
        transform: translateX(-100%);
        transition: transform 0.5s ease;
      }

      .btn-download:hover {
        transform: translateY(-2px);
        box-shadow:
          0 8px 32px var(--accent-glow),
          0 0 0 4px rgba(79, 140, 255, 0.15);
      }

      .btn-download:hover::before {
        transform: translateX(100%);
      }

      .btn-download:active {
        transform: translateY(0);
      }

      .btn-download:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .btn-download svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      .btn-download .btn-text {
        transition: opacity 0.2s ease;
      }

      .btn-download.loading .btn-text {
        opacity: 0.6;
      }

      .btn-download.loading::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }

      .feature {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 14px;
        text-align: center;
        transition: border-color 0.3s ease, background 0.3s ease;
      }

      .feature:hover {
        border-color: rgba(79, 140, 255, 0.2);
        background: rgba(79, 140, 255, 0.04);
      }

      .footer a:hover {
        color: var(--accent);
      }

      .footer .divider {
        margin: 0 8px;
        color: var(--border);
      }

      .error-msg {
        display: none;
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 20px;
        font-size: 13px;
        color: #fca5a5;
        text-align: center;
      }

      .error-msg.visible {
        display: block;
      }

      @media (max-width: 480px) {
        .container {
          padding: 32px 16px;
        }
        .hero h1 {
          font-size: 26px;
        }
        .card {
          padding: 24px 20px;
        }
        .features {
          grid-template-columns: 1fr;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="container">
      <div class="hero">
        <div class="logo">EC</div>
        <h1>e-Calendar</h1>
        <p class="tagline">
          This is the e-Calendar app for barangay events. Check schedules, read announcements, and keep up with what's happening in the community.
        </p>
      </div>

      <div class="card">
        <div class="status-row">
          <div class="status-dot"></div>
          <span class="status-text">All set, tap the button below</span>
          <span class="version-badge" id="version">v latest</span>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button class="btn-download" id="downloadBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span class="btn-text">Get the App</span>
        </button>
      </div>

      <div class="features">
        <div class="feature">
          <div class="feature-label">Schedules</div>
        </div>
        <div class="feature">
          <div class="feature-label">Announcements</div>
        </div>
        <div class="feature">
          <div class="feature-label">Community Posts</div>
        </div>
      </div>

      <div class="footer">
        <a href="https://github.com/Vincentjhon31/barangay-events" target="_blank" rel="noopener">GitHub</a>
        <span class="divider">&middot;</span>
        <a href="https://github.com/Vincentjhon31/barangay-events/releases/latest" target="_blank" rel="noopener" id="manualLink">View Releases</a>
      </div>
    </div>

    <script>
      var releasesPage =
        "https://github.com/Vincentjhon31/barangay-events/releases/latest";
      var downloadBtn = document.getElementById("downloadBtn");
      var errorMsg = document.getElementById("errorMsg");
      var versionBadge = document.getElementById("version");
      var manualLink = document.getElementById("manualLink");

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add("visible");
        downloadBtn.disabled = false;
        downloadBtn.classList.remove("loading");
      }

      function startDownload(url) {
        var a = document.createElement("a");
        a.href = url;
        a.download = "";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      downloadBtn.addEventListener("click", function () {
        downloadBtn.disabled = true;
        downloadBtn.classList.add("loading");

        fetch(
          "https://api.github.com/repos/Vincentjhon31/barangay-events/releases/latest",
        )
          .then(function (r) {
            if (!r.ok) throw new Error("Failed to fetch release info");
            return r.json();
          })
          .then(function (release) {
            var assets = release.assets || [];
            var apk = assets.find(function (a) {
              return (
                a.name.endsWith(".apk") && a.name !== "e-calendar-latest.apk"
              );
            }) || assets.find(function (a) {
              return a.name.endsWith(".apk");
            });

            if (!apk) {
              window.open(releasesPage, "_blank");
              return;
            }

            if (release.tag_name) {
              versionBadge.textContent = release.tag_name;
            }

            manualLink.href = apk.browser_download_url;
            startDownload(apk.browser_download_url);
            downloadBtn.classList.remove("loading");
            downloadBtn.disabled = false;
          })
          .catch(function () {
            showError("Something went wrong fetching the release. Try the link below.");
            window.open(releasesPage, "_blank");
          });
      });
    </script>
  </body>
</html>
