<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download e-Calendar</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: linear-gradient(180deg, #05070c, #0a0d14);
        color: #eaf2ff;
        text-align: center;
      }
      .card {
        padding: 32px 24px;
        max-width: 340px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 18px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #2b7fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p {
        color: #9fb1cc;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 16px;
      }
      a {
        color: #6ea8ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h1>Downloading e-Calendar<span id="version"></span>…</h1>
      <p>Your download should start automatically.</p>
      <p>Check your downloads folder.</p>
      <p>
        If it doesn't,
        <a
          id="manual"
          href="https://github.com/Vincentjhon31/barangay-events/releases/latest"
          >tap here to download</a
        >.
      </p>
    </div>
    <script>
      // This page has a permanent URL (used by the printed QR code) but always
      // forwards to the newest release's VERSIONED apk, so downloaded files are
      // named e-calendar-1.3.0.apk etc. instead of all sharing one name.
      var releasesPage =
        "https://github.com/Vincentjhon31/barangay-events/releases/latest";
      fetch(
        "https://api.github.com/repos/Vincentjhon31/barangay-events/releases/latest",
      )
        .then(function (r) {
          return r.json();
        })
        .then(function (release) {
          var assets = release.assets || [];
          var apk =
            assets.find(function (a) {
              return (
                a.name.endsWith(".apk") && a.name !== "e-calendar-latest.apk"
              );
            }) ||
            assets.find(function (a) {
              return a.name.endsWith(".apk");
            });
          if (!apk) {
            window.location.href = releasesPage;
            return;
          }
          if (release.tag_name) {
            document.getElementById("version").textContent =
              " " + release.tag_name;
          }
          document.getElementById("manual").href = apk.browser_download_url;
          window.location.href = apk.browser_download_url;
        })
        .catch(function () {
          window.location.href = releasesPage;
        });
    </script>
  </body>
</html>
