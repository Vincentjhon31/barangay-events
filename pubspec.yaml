name: barangay_events
description: A barangay calendar app for event scheduling and sharing.
publish_to: "none"
# App version. The number after "+" is Android's internal build counter
# (versionCode) — it never shows to users, but it MUST go up by 1 on every
# release or Android will refuse to install the update. Release tags and the
# APK filename use only the part before "+" (e.g. v1.2.0, e-calendar-1.2.0.apk).
version: 1.5.0+14
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2
  package_info_plus: ^8.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.15.2
  table_calendar: ^3.2.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
